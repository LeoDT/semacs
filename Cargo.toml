[package]
name = "semacs"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[profile.dev]
debug = "line-tables-only"

[features]
native-profiler = ["gpui-kit/profiler"]

[[example]]
name = "perf_native"
required-features = ["native-profiler"]

[dependencies]
gpui-kit = "0.8.1"
futures-channel = "0.3"
rquickjs = "0.14"
heapless = "0.9.2"
log = "0.4"
nucleo-matcher = "0.3.1"
rayon = "1.8"
smallvec = "1.15"
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-md = "=0.5.4"
tree-sitter-html = "=0.23.2"
tree-sitter-css = "=0.25.0"
unicode-segmentation = "1.10"
unicode-width = "0.2"

[dev-dependencies]
gpui-kit = { version = "0.8.1", features = ["test-support"] }
proptest = "1.12"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui-wgpu = { package = "gpui-pre-wgpu", version = "=0.3.10" }
