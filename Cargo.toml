[package]
name = "semacs"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[profile.dev]
debug = "line-tables-only"

[features]
native-profiler = ["gpui-kit/profiler"]

[[example]]
name = "perf_native"
required-features = ["native-profiler"]

[dependencies]
gpui-kit = "0.8.1"
futures-channel = "0.3"
rquickjs = "0.14"
heapless = "0.9.2"
log = "0.4"
nucleo-matcher = "0.3.1"
rayon = "1.8"
smallvec = "1.15"
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
unicode-segmentation = "1.10"
unicode-width = "0.2"

[dev-dependencies]
gpui-kit = { version = "0.8.1", features = ["test-support"] }
proptest = "1.12"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
