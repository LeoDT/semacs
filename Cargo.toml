[package]
name = "semacs"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[features]
native-profiler = ["gpui-kit/profiler"]

[[example]]
name = "perf_native"
required-features = ["native-profiler"]

[dependencies]
gpui-kit = "0.8.1"
heapless = "0.9.2"
log = "0.4"
rayon = "1.8"
unicode-segmentation = "1.10"

[dev-dependencies]
gpui-kit = { version = "0.8.1", features = ["test-support"] }
proptest = "1.12"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
